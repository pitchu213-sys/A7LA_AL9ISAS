name: M7 Generate Exact M6 Candidate Input

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m7-generate-candidate-input.yml'
      - 'evidence_runner/m7_generate_plan.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout evidence repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Reconstruct exact accepted M6 runtime snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat assets/runtime-small/part-*.txt > /tmp/m6-runtime.b64
          base64 --decode /tmp/m6-runtime.b64 > /tmp/m6-runtime.tar.gz
          echo 'dad62570a8db918e205b571a0d994588b2e86ab49f1f746a6b4250a2e85cd0f6  /tmp/m6-runtime.tar.gz' | sha256sum -c -
          mkdir -p m6
          tar -xzf /tmp/m6-runtime.tar.gz -C m6
          printf '%s\n' 'b02bd7743504ef135aed68656f26e84c90cf5af0' > m6/.accepted-head

      - name: Checkout pinned Website baseline read-only
        uses: actions/checkout@v4
        with:
          repository: pitchu213-sys/ahla-qisas
          ref: 98c72e343f35cca378436e8f764b235786c8a70d
          path: website
          fetch-depth: 1
          persist-credentials: false

      - name: Install M6 Python dependencies
        run: python -m pip install --disable-pip-version-check -r m6/requirements.txt

      - name: Generate exact validated M6 ChangeSet
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/m6/src:$GITHUB_WORKSPACE/m6" python evidence_runner/m7_generate_plan.py

      - name: Upload candidate input
        uses: actions/upload-artifact@v4
        with:
          name: m7-exact-m6-candidate-input-${{ github.run_id }}
          path: m7-input/
          retention-days: 30
          if-no-files-found: error
